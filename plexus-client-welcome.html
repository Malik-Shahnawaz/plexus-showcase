        )
    }

    /* -------------------------------------------------------
       SMALL PIECES
    ------------------------------------------------------- */

    function Eyebrow({ num, label }) {
        return h(
            "div",
            { className: "cw-eyebrow" },
            h("span", { className: "cw-eyebrow-num" }, num),
            h("span", null, label)
        )
    }

    function Signature() {
        return h("span", { className: "cw-sig" }, "— THE DIRECTOR")
    }

    function StageCard({ num, title, body, state }) {
        return h(
            "div",
            { className: "cw-stage", "data-state": state },
            h("div", { className: "cw-rail" }),
            h(
                "div",
                { className: "cw-stage-row" },
                h("span", null, num),
                state === "current" && h("span", { className: "cw-stage-here" }, "YOU ARE HERE"),
                state === "done" && h("span", null, "APPROVED")
            ),
            h("span", { className: "cw-stage-title" }, title),
            h("p", { className: "cw-stage-body" }, body)
        )
    }

    /* -------------------------------------------------------
       BRIEF — the nine things we need, one open at a time
    ------------------------------------------------------- */

    /* The answers and open item as one string, to tell a change from a
       rerender and the page's copy from the server's. */
    const serialize = (values, open) =>
        JSON.stringify({
            open,
            answers: Object.fromEntries(
                TYPED_IDS.filter((id) => values[id]).map((id) => [id, values[id]])
            ),
        })

    function without(record, key) {
        if (!(key in record)) return record
        const { [key]: _gone, ...rest } = record
        return rest
    }

    /* Where the brief is (link.kind). local: no Endpoint, or a guest — the
       draft stays on this device and SEND IT is the Send brief link.
       loading: asking the server for the client's draft. ready: the
       server's draft, being edited. unreachable: the server didn't answer;
       the page shows what it has, read-only, and keeps asking unless the
       answer was a refusal. sent: the last brief is in; the page says when
       and offers a new one.

       sync, whether the server has the answers as typed: saved, saving,
       failed. progress, this page's uploads by file id: { percent,
       failed? }. A file row reads uploading, added, failed (with RETRY
       while this page holds the file) or unfinished: a file the server
       lists as still uploading that this page isn't uploading — cut off
       with a closed tab, or going on another device. */
    function BriefSection({ client, slug, storeKey, savesProgress, send, endpoint, anonKey }) {
        /* With an Endpoint the brief is the server's; without one, or for a
           guest, it stays on this device. */
        const remote = Boolean(endpoint) && (storeKey === null || slug !== "")

        /* The first item starts open, as on the boards. Typed answers are
           kept here rather than in the fields, so closing an item and
           reopening it shows what was entered. files is the server's list
           (or, with no server, this device's). */
        const [openId, setOpenId] = React.useState(NEEDS[0].id)
        /* The item NEXT has just opened. Its field takes the focus once it
           is drawn, so the answers can be typed one after another. An item
           opened by its own header doesn't: a phone would throw its keyboard
           over an item the client only meant to read. */
        const [focusId, setFocusId] = React.useState(null)
        const [values, setValues] = React.useState({})
        const [files, setFiles] = React.useState([])
        const [link, setLink] = React.useState(remote ? { kind: "loading" } : { kind: "local" })
        const [sync, setSync] = React.useState("saved")
        const [notice, setNotice] = React.useState(null)
        const [progress, setProgress] = React.useState({})
        const [submit, setSubmit] = React.useState({ status: "idle" })

        /* Mirrors of state for the callbacks that outlive a render: a save
           that fires after the delay, an upload that ends minutes later. */
        const valuesRef = React.useRef(values)
        valuesRef.current = values
        const openRef = React.useRef(openId)
        openRef.current = openId
        const filesRef = React.useRef(files)
        filesRef.current = files
        const linkRef = React.useRef(link)
        linkRef.current = link
        const progressRef = React.useRef(progress)
        progressRef.current = progress
        const propsRef = React.useRef({ client, slug, storeKey, endpoint, anonKey })
        propsRef.current = { client, slug, storeKey, endpoint, anonKey }

        /* The version of the answers the server gave, sent back with each
           save, and the answers as the server last had them, so nothing is
           saved that it already has. */
        const versionRef = React.useRef(1)
        const savedRef = React.useRef(serialize({}, NEEDS[0].id))
        const savingRef = React.useRef(null)
        const saveTimerRef = React.useRef()
        const saveRetriesRef = React.useRef(0)
        const loadTimerRef = React.useRef()
        const loadRetriesRef = React.useRef(0)

        /* The File behind each of this page's uploads, for a retry — and,
           with no server, the files themselves; where each is going; and the
           handle that stops one. Every file chosen is added to the brief at
           once (addingRef: a drop of twenty shows twenty rows), then the
           files go to Storage one at a time, in the order chosen, so the
           percentages mean something (queueRef). */
        const localFilesRef = React.useRef(new Map())
        const uploadsRef = React.useRef(new Map())
        const handlesRef = React.useRef(new Map())
        const addingRef = React.useRef(Promise.resolve())
        const queueRef = React.useRef(Promise.resolve())
        /* True from the click until the send settles. The state says the
           same, but a second click in the same frame would still read the
           old one. */
        const sendingRef = React.useRef(false)
        /* The section, and whether a send made on this page has just gone
           through: the list folds into the SENT card then, and the view is
           brought back up to the section (see the effect after sendBrief). */
        const sectionRef = React.useRef(null)
        const sentHereRef = React.useRef(false)
        const mountedRef = React.useRef(true)
        React.useEffect(() => {
            mountedRef.current = true
            return () => {
                mountedRef.current = false
            }
        }, [])

        /* THE CACHE. restoredKey is the storeKey whose entry has been looked
           for: until it matches, nothing is written, so a fresh page can't
           write its empty state over an entry it hasn't read yet. lastCached
           is the draft as last read or written, so an unchanged draft isn't
           written again. uncached is the write the timer is waiting to make,
           for pagehide to make at once. */
        const restoredKeyRef = React.useRef(null)
        const lastCachedRef = React.useRef("")
        const uncachedRef = React.useRef(null)
        const cacheTimerRef = React.useRef()

        /* Runs once per storeKey, before the cache effect below can write. */
        React.useEffect(() => {
            if (!storeKey || restoredKeyRef.current === storeKey) return
            const stored = readStoredBrief(storeKey)
            if (stored) {
                setValues(stored.draft.answers)
                setOpenId(stored.draft.open)
                setFiles(stored.draft.files)
                lastCachedRef.current = JSON.stringify(stored.draft)
            } else {
                /* Nothing saved: the empty draft counts as cached, so a visit
                   that types nothing writes nothing. */
                lastCachedRef.current = JSON.stringify(EMPTY_DRAFT)
            }
            restoredKeyRef.current = storeKey
        }, [storeKey])

        const draft = {
            open: openId,
            answers: Object.fromEntries(
                TYPED_IDS.filter((id) => values[id]).map((id) => [id, values[id]])
            ),
            files,
        }
        const serializedDraft = JSON.stringify(draft)

        const cacheNow = () => {
            clearTimeout(cacheTimerRef.current)
            const uncached = uncachedRef.current
            if (!uncached) return
            uncachedRef.current = null
            const written = writeStoredBrief(uncached.storeKey, {
                version: STORE_VERSION,
                updatedAt: new Date().toISOString(),
                draft: uncached.draft,
            })
            if (written) lastCachedRef.current = uncached.serialized
        }

        /* Each change queues one write, CACHE_DELAY_MS after the last of
           them. Not while the draft is what was last cached (so a restore
           writes nothing back), not before the restore has run, not while
           the server is still being asked (the state is the cache itself),
           and not once the brief is sent: the entry is gone then. */
        React.useEffect(() => {
            if (
                !storeKey ||
                restoredKeyRef.current !== storeKey ||
                link.kind === "loading" ||
                link.kind === "sent" ||
                serializedDraft === lastCachedRef.current
            ) {
                return
            }
            uncachedRef.current = { storeKey, serialized: serializedDraft, draft }
            clearTimeout(cacheTimerRef.current)
            cacheTimerRef.current = setTimeout(cacheNow, CACHE_DELAY_MS)
            return () => clearTimeout(cacheTimerRef.current)
        }, [storeKey, serializedDraft, link.kind])

        /* THE SERVER'S BRIEF becomes the page's. Uploads this page was making
           that the server no longer lists — removed from another device —
           are stopped. */
        const adopt = (brief) => {
            versionRef.current = brief.version
            savedRef.current = serialize(brief.answers, brief.open)
            clearTimeout(saveTimerRef.current)
            saveRetriesRef.current = 0
            setValues(brief.answers)
            setOpenId(brief.open)
            filesRef.current = brief.files
            setFiles(brief.files)
            setSync("saved")
            for (const [fileId, handle] of handlesRef.current) {
                if (!brief.files.some((file) => file.id === fileId)) handle.abort()
            }
            setProgress((current) =>
                Object.fromEntries(
                    Object.entries(current).filter(([fileId]) =>
                        brief.files.some((file) => file.id === fileId)
                    )
                )
            )
            if (brief.status === "submitted") {
                const { storeKey: key } = propsRef.current
                if (key) clearStoredBrief(key)
                setLink({ kind: "sent", sentAt: brief.submittedAt })
            } else {
                setLink({ kind: "ready", id: brief.id })
            }
        }

        /* Asks the server for the client's draft. quiet is a refresh of a
           page already loaded (the tab came back): a failure then changes
           nothing. Otherwise a failure shows, and the ask is repeated,
           unless the server refused outright — a bad address — which
           repeating wouldn't mend. */
        const loadBrief = async (quiet) => {
            const { client: name, slug: who, storeKey: key, endpoint: url, anonKey: token } =
                propsRef.current
            try {
                const answer = await callBrief(url, token, { action: "load", slug: who, client: name })
                if (!mountedRef.current) return
                const brief = parseBrief(answer.brief)
                if (brief) {
                    adopt(brief)
                } else if (answer.brief === null) {
                    if (key) clearStoredBrief(key)
                    setLink({
                        kind: "sent",
                        sentAt: typeof answer.lastSent === "string" ? answer.lastSent : null,
                    })
                } else {
                    throw new Error("Unexpected answer to load")
                }
                loadRetriesRef.current = 0
            } catch (err) {
                if (!mountedRef.current || quiet) return
                if (!(err instanceof SendError)) console.error("Loading the brief failed:", err)
                const refused =
                    err instanceof BriefError &&
                    err.status >= 400 &&
                    err.status < 500 &&
                    err.status !== 429
                setLink({
                    kind: "unreachable",
                    message: refused ? err.message : UNREACHABLE,
                })
                if (refused) return
                const delay = RETRY_MS[Math.min(loadRetriesRef.current++, RETRY_MS.length - 1)]
                loadTimerRef.current = setTimeout(() => loadBrief(false), delay)
            }
        }

        /* The address read: a guest's page is device-only; a client's waits
           for the server. */
        React.useEffect(() => {
            if (!remote) {
                setLink({ kind: "local" })
                return
            }
            if (linkRef.current.kind === "local") setLink({ kind: "loading" })
            if (!storeKey) return
            loadBrief(false)
            return () => clearTimeout(loadTimerRef.current)
        }, [remote, storeKey])

        /* SAVING. One save at a time, with the version the page has. A save
           over a newer version comes back refused with the newer brief,
           which takes the page's place. keepalive is for the tab's last
           save, as it closes. Answers "saved", "conflict" or "failed". */
        const runSave = (keepalive = false) => {
            if (savingRef.current) return savingRef.current
            const current = linkRef.current
            if (current.kind !== "ready") return Promise.resolve("failed")
            const open = openRef.current
            const answers = Object.fromEntries(TYPED_IDS.map((id) => [id, valuesRef.current[id] ?? ""]))
            const payload = serialize(valuesRef.current, open)
            if (payload === savedRef.current) return Promise.resolve("saved")
            const version = versionRef.current
            const { slug: who, endpoint: url, anonKey: token } = propsRef.current
            const run = (async () => {
                try {
                    const answer = await callBrief(
                        url,
                        token,
                        { action: "save", slug: who, id: current.id, version, open, answers },
                        keepalive
                    )
                    if (!mountedRef.current) return "saved"
                    versionRef.current =
                        typeof answer.version === "number" ? answer.version : version + 1
                    savedRef.current = payload
                    saveRetriesRef.current = 0
                    /* Typed on while this went: the next save is due. */
                    if (serialize(valuesRef.current, openRef.current) !== payload) scheduleSave(0)
                    else setSync("saved")
                    return "saved"
                } catch (err) {
                    if (!mountedRef.current) return "failed"
                    if (err instanceof BriefError && (err.status === 409 || err.status === 404)) {
                        const brief = parseBrief(err.answer.brief)
                        if (brief) {
                            adopt(brief)
                            if (brief.status === "draft") setNotice(CHANGED_ELSEWHERE)
                        } else {
                            loadBrief(false)
                        }
                        return "conflict"
                    }
                    if (!(err instanceof SendError)) console.error("Saving the brief failed:", err)
                    setSync("failed")
                    /* A refusal (a bad item, too long) would repeat the same
                       way; anything else — no connection, the server's own
                       trouble — is tried again. */
                    const refused =
                        err instanceof BriefError &&
                        err.status >= 400 &&
                        err.status < 500 &&
                        err.status !== 429
                    if (!refused) {
                        const delay =
                            RETRY_MS[Math.min(saveRetriesRef.current++, RETRY_MS.length - 1)]
                        scheduleSave(delay)
                    }
                    return "failed"
                } finally {
                    savingRef.current = null
                }
            })()
            savingRef.current = run
            return run
        }

        const scheduleSave = (delay) => {
            clearTimeout(saveTimerRef.current)
            saveTimerRef.current = setTimeout(() => {
                runSave()
            }, delay)
        }

        /* Each change queues one save, SAVE_DELAY_MS after the last of them,
           while the page has the server's draft and the answers differ from
           what the server has. */
        const serializedAnswers = serialize(values, openId)
        React.useEffect(() => {
            if (link.kind !== "ready" || serializedAnswers === savedRef.current) return
            setSync("saving")
            scheduleSave(SAVE_DELAY_MS)
            return () => clearTimeout(saveTimerRef.current)
        }, [link.kind, serializedAnswers])

        /* The latest of the callbacks below, for the one-time listeners. */
        const latestRef = React.useRef({ cacheNow, runSave, loadBrief })
        latestRef.current = { cacheNow, runSave, loadBrief }

        /* A tab closed or backgrounded gets its cache write and its save at
           once. pagehide is the last event a tab can rely on, on phones too;
           visibilitychange covers a phone that puts the browser away and
           later discards it. A tab that comes back asks the server for the
           brief again, so what was typed on another device meanwhile shows —
           unless it has a change of its own still to save, which goes
           first. */
        React.useEffect(() => {
            const flush = () => {
                latestRef.current.cacheNow()
                if (linkRef.current.kind === "ready") {
                    clearTimeout(saveTimerRef.current)
                    latestRef.current.runSave(true)
                }
            }
            const onVisibility = () => {
                if (document.visibilityState === "hidden") {
                    flush()
                } else if (
                    linkRef.current.kind === "ready" &&
                    !savingRef.current &&
                    serialize(valuesRef.current, openRef.current) === savedRef.current
                ) {
                    latestRef.current.loadBrief(true)
                }
            }
            window.addEventListener("pagehide", flush)
            document.addEventListener("visibilitychange", onVisibility)
            return () => {
                window.removeEventListener("pagehide", flush)
                document.removeEventListener("visibilitychange", onVisibility)
                latestRef.current.cacheNow()
            }
        }, [])

        /* FILES. How each row reads, from the server's list and this page's
           uploads. With no server, a file is in only while this page holds
           it. */
        const fileState = (file) => {
            const going = progress[file.id]
            if (going?.failed) {
                return { kind: "failed", retry: localFilesRef.current.has(file.id) }
            }
            if (going) return { kind: "uploading", percent: going.percent }
            if (file.status === "uploaded" && (remote || localFilesRef.current.has(file.id))) {
                return { kind: "added" }
            }
            return { kind: "unfinished" }
        }

        /* An email item counts once what's typed looks like an address, so
           half of one never reads ADDED. */
        const counts = (need) => {
            if (need.kind === "upload") {
                return files.some((file) => {
                    if (file.item !== need.id) return false
                    const state = fileState(file).kind
                    return state === "added" || state === "uploading"
                })
            }
            const value = (values[need.id] ?? "").trim()
            return need.kind === "email" ? looksLikeEmail(value) : value !== ""
        }

        const chain = (ref, job) => {
            ref.current = ref.current.then(job).catch(() => undefined)
        }
        const enqueue = (job) => chain(queueRef, job)

        /* One file, from the moment it is chosen: the server adds it and
           signs its token, so it shows on the list and counts as going at
           once; then, in its turn, the file goes to Storage and confirm
           marks it in. The same name chosen again while its first upload is
           going takes its place: the server replaces the entry, and the
           first upload stops here. */
        const uploadOne = async (item, file) => {
            const current = linkRef.current
            if (current.kind !== "ready" || !mountedRef.current) return
            for (const listed of filesRef.current) {
                if (listed.item === item && listed.name === file.name) {
                    handlesRef.current.get(listed.id)?.abort()
                }
            }
            const { slug: who, endpoint: url, anonKey: token } = propsRef.current
            let started
            try {
                started = parseUpload(
                    await callBrief(url, token, {
                        action: "upload",
                        slug: who,
                        id: current.id,
                        item,
                        name: file.name,
                        size: file.size,
                    })
                )
            } catch (err) {
                if (!mountedRef.current) return
                if (err instanceof BriefError && err.status === 409) {
                    const brief = parseBrief(err.answer.brief)
                    if (brief) adopt(brief)
                    return
                }
                if (!(err instanceof SendError)) console.error("Adding a file failed:", err)
                setNotice(err instanceof SendError ? err.message : SEND_FAILED)
                return
            }
            if (!mountedRef.current) return
            localFilesRef.current.set(started.file.id, file)
            uploadsRef.current.set(started.file.id, started.upload)
            /* The ref as well as the state: the transfer may start before
               the render that would mirror it. */
            filesRef.current = started.files
            setFiles(started.files)
            setProgress((p) => ({ ...p, [started.file.id]: { percent: 0 } }))
            enqueue(() => transfer(started.file, file, started.upload))
        }

        /* The file to Storage, then confirm. A failure leaves the row marked
           so, with RETRY while this page still has the file. */
        const transfer = async (entry, file, upload) => {
            if (!mountedRef.current) return
            const current = linkRef.current
            /* Gone from the list while it waited its turn — removed, chosen
               again, the brief taken over from another device — or the page
               no longer on the draft: nothing to send. */
            if (current.kind !== "ready" || !filesRef.current.some((f) => f.id === entry.id)) {
                setProgress((p) => without(p, entry.id))
                return
            }
            const { slug: who, endpoint: url, anonKey: token } = propsRef.current
            const handle = newHandle()
            handlesRef.current.set(entry.id, handle)
            setProgress((p) => ({ ...p, [entry.id]: { percent: 0 } }))
            try {
                await putFile(
                    upload,
                    file,
                    (loaded) => {
                        if (!mountedRef.current) return
                        const percent = Math.min(99, Math.floor((loaded / file.size) * 100))
                        setProgress((p) => (p[entry.id] ? { ...p, [entry.id]: { percent } } : p))
                    },
                    async () => {
                        const signed = await callBrief(url, token, {
                            action: "sign",
                            slug: who,
                            id: current.id,
                            fileId: entry.id,
                        })
                        if (typeof signed.token !== "string") {
                            throw new Error("Unexpected answer to sign")
                        }
                        return signed.token
                    },
                    handle
                )
                const answer = await callBrief(url, token, {
                    action: "confirm",
                    slug: who,
                    id: current.id,
                    fileId: entry.id,
                })
                if (!mountedRef.current) return
                setFiles(
                    parseFiles(answer.files) ??
                        filesRef.current.map((f) =>
                            f.id === entry.id ? { ...f, status: "uploaded" } : f
                        )
                )
                setProgress((p) => without(p, entry.id))
                uploadsRef.current.delete(entry.id)
            } catch (err) {
                if (!mountedRef.current) return
                if (err instanceof CancelledError) {
                    setProgress((p) => without(p, entry.id))
                    return
                }
                if (err instanceof BriefError && (err.status === 404 || err.status === 409)) {
                    /* The file was removed, or the brief sent, from another
                       device while this went. */
                    setProgress((p) => without(p, entry.id))
                    const brief = parseBrief(err.answer.brief)
                    if (brief) adopt(brief)
                    else setFiles((f) => f.filter((x) => x.id !== entry.id))
                    return
                }
                if (!(err instanceof SendError)) console.error("Uploading a file failed:", err)
                setProgress((p) => ({
                    ...p,
                    [entry.id]: {
                        percent: p[entry.id]?.percent ?? 0,
                        failed: err instanceof SendError ? err.message : SEND_FAILED,
                    },
                }))
            } finally {
                handlesRef.current.delete(entry.id)
            }
        }

        const addFiles = (item, chosen) => {
            setNotice(null)
            if (!remote) {
                /* No server: the files are held here, and a name chosen again
                   takes the earlier one's place, as on the server. */
                const entries = chosen.map((file) => {
                    const id = newId()
                    localFilesRef.current.set(id, file)
                    return { id, item, name: file.name, size: file.size, status: "uploaded" }
                })
                setFiles((current) => [
                    ...current.filter(
                        (f) => !(f.item === item && chosen.some((c) => c.name === f.name))
                    ),
                    ...entries,
                ])
                return
            }
            for (const file of chosen) chain(addingRef, () => uploadOne(item, file))
        }

        /* A failed upload sent again, with a fresh token: the first may well
           have run out while the file waited. */
        const retryUpload = (fileId) => {
            const file = localFilesRef.current.get(fileId)
            const upload = uploadsRef.current.get(fileId)
            const entry = filesRef.current.find((f) => f.id === fileId)
            const current = linkRef.current
            if (!file || !upload || !entry || current.kind !== "ready") return
            setProgress((p) => ({ ...p, [fileId]: { percent: 0 } }))
            enqueue(async () => {
                const { slug: who, endpoint: url, anonKey: token } = propsRef.current
                let fresh
                try {
                    const signed = await callBrief(url, token, {
                        action: "sign",
                        slug: who,
                        id: current.id,
                        fileId,
                    })
                    if (typeof signed.token !== "string") throw new Error("Unexpected answer to sign")
                    fresh = signed.token
                } catch (err) {
                    if (!mountedRef.current) return
                    if (!(err instanceof SendError)) console.error("Renewing an upload failed:", err)
                    setProgress((p) => ({
                        ...p,
                        [fileId]: {
                            percent: 0,
                            failed: err instanceof SendError ? err.message : SEND_FAILED,
                        },
                    }))
                    return
                }
                await transfer(entry, file, { ...upload, token: fresh })
            })
        }

        /* Off the page at once, and off the server and out of Storage after.
           An upload still going is stopped first. */
        const removeFile = async (fileId) => {
            handlesRef.current.get(fileId)?.abort()
            const entry = filesRef.current.find((f) => f.id === fileId)
            localFilesRef.current.delete(fileId)
            uploadsRef.current.delete(fileId)
            setProgress((p) => without(p, fileId))
            filesRef.current = filesRef.current.filter((f) => f.id !== fileId)
            setFiles((current) => current.filter((f) => f.id !== fileId))
            const current = linkRef.current
            if (!remote || current.kind !== "ready") return
            const { slug: who, endpoint: url, anonKey: token } = propsRef.current
            try {
                const answer = await callBrief(url, token, {
                    action: "remove",
                    slug: who,
                    id: current.id,
                    fileId,
                })
                const list = parseFiles(answer.files)
                if (list && mountedRef.current) setFiles(list)
            } catch (err) {
                if (!mountedRef.current) return
                if (err instanceof BriefError && err.status === 409) {
                    const brief = parseBrief(err.answer.brief)
                    if (brief) adopt(brief)
                    return
                }
                if (!(err instanceof SendError)) console.error("Removing a file failed:", err)
                setNotice(`Couldn't remove ${entry?.name ?? "the file"}. Try again.`)
                loadBrief(true)
            }
        }

        const inFlight = files.some((file) => {
            const going = progress[file.id]
            return Boolean(going) && !going.failed
        })

        /* Of every byte this page is uploading, the share that has gone. */
        const uploadPercent = () => {
            let total = 0
            let loaded = 0
            for (const file of files) {
                const going = progress[file.id]
                if (!going || going.failed) continue
                total += file.size
                loaded += (file.size * going.percent) / 100
            }
            return total ? Math.min(99, Math.floor((loaded / total) * 100)) : 0
        }

        /* Closing the tab would cut an upload or the send short; the browser
           asks first. */
        const sending = submit.status === "sending"
        React.useEffect(() => {
            if (!sending && !inFlight) return
            const warn = (e) => {
                e.preventDefault()
                e.returnValue = ""
            }
            window.addEventListener("beforeunload", warn)
            return () => window.removeEventListener("beforeunload", warn)
        }, [sending, inFlight])

        const doneCount = NEEDS.filter(counts).length
        const complete = doneCount === NEEDS.length
        const progressPercent =
            link.kind === "sent" ? 100 : Math.round((doneCount / NEEDS.length) * 100)

        /* SENDING. The answers are saved first, then any upload still going
           is waited for, then the server is asked to submit: it checks every
           file is in Storage and tells Slack. A brief already sent — from
           another device, or a first answer lost — is taken as sent. */
        const sendBrief = async () => {
            const current = linkRef.current
            if (sendingRef.current || current.kind !== "ready") return
            /* The function would refuse it too; here the item opens on it. */
            const badEmail = NEEDS.find(
                (need) =>
                    need.kind === "email" &&
                    (values[need.id] ?? "").trim() !== "" &&
                    !counts(need)
            )
            if (badEmail) {
                setOpenId(badEmail.id)
                setSubmit({ status: "error", message: BAD_EMAIL })
                return
            }
            if (doneCount === 0) {
                setSubmit({
                    status: "error",
                    message: "Add at least one item before sending.",
                })
                return
            }
            sendingRef.current = true
            setSubmit({ status: "sending" })
            setNotice(null)
            const { slug: who, storeKey: key, endpoint: url, anonKey: token } = propsRef.current
            try {
                clearTimeout(saveTimerRef.current)
                let saved = await runSave()
                while (
                    saved === "saved" &&
                    serialize(valuesRef.current, openRef.current) !== savedRef.current
                ) {
                    saved = await runSave()
                }
                if (saved === "conflict") throw new SendError(CHANGED_BEFORE_SEND)
                if (saved === "failed") throw new SendError(NOT_SAVED)

                await addingRef.current
                await queueRef.current
                if (!mountedRef.current) return
                const unfinished = filesRef.current.filter((file) => {
                    const going = progressRef.current[file.id]
                    return going ? Boolean(going.failed) : file.status !== "uploaded"
                })
                if (unfinished.length) throw new SendError(UNFINISHED)

                const answer = await callBrief(url, token, {
                    action: "submit",
                    slug: who,
                    id: current.id,
                })
                if (!mountedRef.current) return
                if (key) clearStoredBrief(key)
                sentHereRef.current = true
                setSubmit({ status: "idle" })
                setLink({
                    kind: "sent",
                    sentAt:
                        typeof answer.submittedAt === "string"
                            ? answer.submittedAt
                            : new Date().toISOString(),
                })
            } catch (err) {
                if (!mountedRef.current) return
                if (err instanceof BriefError && err.answer.submitted === true) {
                    sentHereRef.current = true
                    const brief = parseBrief(err.answer.brief)
                    if (brief) adopt(brief)
                    else setLink({ kind: "sent", sentAt: null })
                    if (key) clearStoredBrief(key)
                    setSubmit({ status: "idle" })
                    return
                }
                if (err instanceof BriefError && Array.isArray(err.answer.unfinished)) {
                    const ids = err.answer.unfinished.filter((x) => typeof x === "string")
                    setProgress((p) => ({
                        ...p,
                        ...Object.fromEntries(
                            ids.map((fileId) => [fileId, { percent: 0, failed: "Didn't finish." }])
                        ),
                    }))
                }
                if (!(err instanceof SendError)) console.error("Sending the brief failed:", err)
                setSubmit({
                    status: "error",
                    message: err instanceof SendError ? err.message : SEND_FAILED,
                })
            } finally {
                sendingRef.current = false
            }
        }

        /* Once sent, the nine items fold into the SENT card and the page
           loses most of the list's height, so a visitor who pressed SEND IT
           at its foot is left looking at FROM HERE. The view goes back up to
           the section's top — only from below it: a visitor who scrolled
           above it while the files went isn't moved. After the render that
           folds the list, so the section is where it will stay. */
        React.useEffect(() => {
            if (!sentHereRef.current) return
            sentHereRef.current = false
            const section = sectionRef.current
            if (link.kind !== "sent" || !section) return
            if (section.getBoundingClientRect().top >= 0) return
            const still = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches
            section.scrollIntoView({ behavior: still ? "auto" : "smooth", block: "start" })
        }, [link.kind])

        /* START A NEW BRIEF, after a sent one. */
        const startNew = async () => {
            const current = linkRef.current
            if (current.kind !== "sent") return
            setLink({ kind: "loading" })
            setSubmit({ status: "idle" })
            setNotice(null)
            const { client: name, slug: who, endpoint: url, anonKey: token } = propsRef.current
            try {
                const answer = await callBrief(url, token, { action: "create", slug: who, client: name })
                const brief = parseBrief(answer.brief)
                if (!brief) throw new Error("Unexpected answer to create")
                if (mountedRef.current) adopt(brief)
            } catch (err) {
                if (!mountedRef.current) return
                if (!(err instanceof SendError)) console.error("Starting a brief failed:", err)
                setLink(current)
                setNotice(err instanceof SendError ? err.message : SEND_FAILED)
            }
        }

        /* The fields hold still while the server is being asked, or the
           brief is on its way: an edit then would go nowhere. */
        const locked = link.kind === "loading" || link.kind === "unreachable" || sending

        const ctaLabel = !sending
            ? "SEND IT TO THE DIRECTOR"
            : inFlight
              ? `UPLOADING · ${uploadPercent()}%`
              : "SENDING…"

        /* The line under the bar: where the brief stands with the server. */
        const status =
            link.kind === "loading"
                ? { text: "Loading your brief…", tone: "quiet" }
                : link.kind === "unreachable"
                  ? { text: link.message, tone: "loud" }
                  : link.kind === "local"
                    ? {
                          text: savesProgress
                              ? "Come back anytime — we save what you've added."
                              : "Send what you have; you can send more later.",
                          tone: "quiet",
                      }
                    : sync === "saving"
                      ? { text: "Saving…", tone: "quiet" }
                      : sync === "failed"
                        ? { text: SAVE_FAILED, tone: "loud" }
                        : {
                              text: savesProgress
                                  ? "Saved. Come back anytime, on any device."
                                  : "Send what you have; you can send more later.",
                              tone: "quiet",
                          }

        const arrow = h("span", { className: "cw-cta-arrow", "aria-hidden": "true" }, "→")

        return h(
            "section",
            { className: "cw-brief", ref: sectionRef },
            h(
                "div",
                { className: "cw-head cw-brief-intro" },
                h(Eyebrow, { num: "03", label: "YOUR BRIEF" }),
                h("h2", { className: "cw-h2" }, "Your brand is the source of truth."),
                h(
                    "p",
                    { className: "cw-head-note" },
                    "What we feature comes from you and appears exactly as you send it. Open each item to add it. ",
                    h("br", { className: "cw-br" }),
                    "Short answers are fine."
                ),
                h(
                    "div",
                    { className: "cw-progress" },
                    h(
                        "span",
                        { className: "cw-progress-label", "aria-live": "polite" },
                        link.kind === "sent" || complete
                            ? "That's everything. The director's reading it."
                            : `${doneCount} OF ${NEEDS.length} ADDED`
                    ),
                    h(
                        "div",
                        { className: "cw-bar", "aria-hidden": "true" },
                        h("div", { className: "cw-bar-fill", style: { width: `${progressPercent}%` } })
                    ),
                    link.kind !== "sent" &&
                        h("span", { className: "cw-saved", "data-tone": status.tone, role: "status" }, status.text),
                    notice && h("span", { className: "cw-notice", role: "status" }, notice)
                )
            ),

            h(
                "div",
                { className: "cw-brief-list" },
                link.kind === "sent"
                    ? h(
                          "div",
                          { className: "cw-send cw-send-done" },
                          h("div", { className: "cw-sent", role: "status" }, "SENT TO THE DIRECTOR"),
                          h(
                              "p",
                              { className: "cw-send-after" },
                              sentOn(link.sentAt)
                                  ? `Sent on ${sentOn(link.sentAt)}. We'll be in touch soon.`
                                  : "We'll be in touch soon.",
                              " Next up: the director prepares your script, look, and shot plan. You approve everything before we build."
                          ),
                          h(
                              "button",
                              { type: "button", className: "cw-pill cw-new-brief", onClick: startNew },
                              "START A NEW BRIEF"
                          )
                      )
                    : h(
                          Fragment,
                          null,
                          h(
                              "div",
                              { className: "cw-needs" },
                              NEEDS.map((need, i) =>
                                  h(NeedRow, {
                                      key: need.id,
                                      need,
                                      num: pad(i),
                                      open: openId === need.id,
                                      done: counts(need),
                                      value: values[need.id] ?? "",
                                      files: files.filter((file) => file.item === need.id),
                                      stateOf: fileState,
                                      isLast: i === NEEDS.length - 1,
                                      locked,
                                      onToggle: () => setOpenId(openId === need.id ? null : need.id),
                                      takesFocus: focusId === need.id,
                                      onFocused: () => setFocusId(null),
                                      onNext: () => {
                                          const next = i < NEEDS.length - 1 ? NEEDS[i + 1].id : null
                                          setOpenId(next)
                                          setFocusId(next)
                                      },
                                      onValue: (value) => setValues((v) => ({ ...v, [need.id]: value })),
                                      onFiles: (list) => addFiles(need.id, list),
                                      onRemove: removeFile,
                                      onRetry: retryUpload,
                                  })
                              )
                          ),

                          h(
                              "div",
                              { className: "cw-send" },
                              h(
                                  "p",
                                  { className: "cw-send-hint" },
                                  "Don't have every answer? Leave it blank. We will follow up if we need more."
                              ),
                              /* No Endpoint, or a guest: the CTA is the Send
                                 brief link. */
                              link.kind === "local"
                                  ? h(
                                        "a",
                                        { className: "cw-cta", href: send },
                                        h("span", null, "SEND IT TO THE DIRECTOR"),
                                        arrow
                                    )
                                  : h(
                                        "button",
                                        {
                                            type: "button",
                                            className: "cw-cta",
                                            "aria-busy": sending,
                                            disabled: link.kind !== "ready",
                                            onClick: sendBrief,
                                        },
                                        h("span", null, ctaLabel),
                                        !sending && arrow
                                    ),
                              submit.status === "error" &&
                                  h("p", { className: "cw-send-error", role: "alert" }, submit.message),
                              h(
                                  "p",
                                  { className: "cw-send-after" },
                                  "Next up: the director prepares your script, look, and shot plan. You approve everything before we build."
                              )
                          )
                      )
            )
        )
    }

    function NeedRow({
        need,
        num,
        open,
        done,
        value,
        files,
        stateOf,
        isLast,
        locked,
        takesFocus,
        onFocused,
        onToggle,
        onNext,
        onValue,
        onFiles,
        onRemove,
        onRetry,
    }) {
        const panelId = `${SCOPE}-${need.id}`
        const panelRef = React.useRef(null)
        const inputRef = React.useRef(null)
        const [over, setOver] = React.useState(false)
        const [refused, setRefused] = React.useState([])

        /* The cursor goes in after whatever is already typed, so a returning
           client carries on from the end. An upload item has no field; the
           request is spent all the same. */
        React.useEffect(() => {
            if (!open || !takesFocus) return
            onFocused()
            const field = panelRef.current?.querySelector(".cw-field")
            if (!field) return
            field.focus()
            field.setSelectionRange(field.value.length, field.value.length)
        }, [open, takesFocus])

        /* A choice of only refused files keeps the files already added. */
        const takeFiles = (list) => {
            if (locked || !list || list.length === 0) return
            const formats = need.formats ?? ""
            const all = Array.from(list)
            const taken = all.filter((file) => takes(formats, file.name))
            setRefused(all.filter((file) => !taken.includes(file)).map((file) => file.name))
            if (taken.length) onFiles(taken)
        }

        const added = h("span", { className: "cw-added" }, h(CheckIcon), "ADDED")

        const field = (extra) =>
            h(need.kind === "long" ? "textarea" : "input", {
                className: "cw-field",
                "aria-label": need.title,
                placeholder: need.hint,
                value,
                readOnly: locked,
                onChange: (e) => onValue(e.target.value),
                ...extra,
            })

        return h(
            "div",
            { className: "cw-need", "data-open": open ? "true" : "false" },
            h(
                "button",
                {
                    type: "button",
                    className: "cw-need-toggle",
                    "aria-expanded": open,
                    "aria-controls": panelId,
                    onClick: onToggle,
                },
                h("span", { className: "cw-need-num" }, num),
                h(
                    "span",
                    { className: "cw-need-text" },
                    h("span", { className: "cw-need-title" }, need.title),
                    h("span", { className: "cw-need-body" }, need.body),
                    /* The phone board sets ADDED under the text; the desktop
                       board beside the chevron. Both are here, and the
                       stylesheet shows one. */
                    done && h("span", { className: "cw-added-inline" }, added)
                ),
                h(
                    "span",
                    { className: "cw-need-end" },
                    done && h("span", { className: "cw-added-side" }, added),
                    h(ChevronIcon)
                )
            ),

            open &&
                h(
                    "div",
                    { className: "cw-need-panel", id: panelId, ref: panelRef },
                    need.kind === "upload" &&
                        h(
                            Fragment,
                            null,
                            h(
                                "div",
                                {
                                    className: "cw-drop",
                                    "data-over": over ? "true" : "false",
                                    onDragOver: (e) => {
                                        e.preventDefault()
                                        setOver(true)
                                    },
                                    onDragLeave: () => setOver(false),
                                    onDrop: (e) => {
                                        e.preventDefault()
                                        setOver(false)
                                        takeFiles(e.dataTransfer.files)
                                    },
                                },
                                h(UploadIcon),
                                h("span", { className: "cw-drop-text" }, "Drag files here, or"),
                                h(
                                    "button",
                                    {
                                        type: "button",
                                        className: "cw-pill",
                                        "aria-disabled": locked,
                                        onClick: () => {
                                            if (!locked) inputRef.current?.click()
                                        },
                                    },
                                    "CHOOSE FILES"
                                ),
                                h("span", { className: "cw-formats" }, need.formats),
                                h("input", {
                                    ref: inputRef,
                                    type: "file",
                                    multiple: true,
                                    accept: acceptFor(need.formats ?? ""),
                                    "aria-label": need.title,
                                    className: "cw-file-input",
                                    onChange: (e) => {
                                        takeFiles(e.target.files)
                                        /* So the same file can be chosen
                                           again after a failure. */
                                        e.target.value = ""
                                    },
                                })
                            ),
                            files.length > 0 &&
                                h(
                                    "ul",
                                    { className: "cw-files", "aria-label": `${need.title}: files` },
                                    files.map((file) =>
                                        h(FileRow, {
                                            key: file.id,
                                            file,
                                            state: stateOf(file),
                                            locked,
                                            onRemove: () => onRemove(file.id),
                                            onRetry: () => onRetry(file.id),
                                        })
                                    )
                                ),
                            refused.length > 0 &&
                                h(
                                    "span",
                                    { className: "cw-refused", role: "alert" },
                                    refusedSummary(refused, need.formats ?? "")
                                )
                        ),

                    need.kind === "short" && field({ type: "text", maxLength: MAX_ANSWER_CHARS }),

                    /* Text with an email keyboard rather than type="email",
                       whose value the browser trims and may rewrite (a domain
                       to punycode) under the cursor. The page checks the
                       address itself when the brief is sent. */
                    need.kind === "email" &&
                        field({
                            type: "text",
                            inputMode: "email",
                            autoComplete: "email",
                            autoCapitalize: "off",
                            spellCheck: false,
                            maxLength: MAX_EMAIL_CHARS,
                        }),

                    need.kind === "long" && field({ rows: 4, maxLength: MAX_ANSWER_CHARS }),

                    h("button", { type: "button", className: "cw-next", onClick: onNext }, isLast ? "DONE" : "NEXT →")
                )
        )
    }

    /* One file on an upload item: its name and size, how it stands, and
       REMOVE. A failed upload this page still holds offers RETRY; one it
       doesn't, or one cut off elsewhere, asks for the file again. */
    function FileRow({ file, state, locked, onRemove, onRetry }) {
        return h(
            "li",
            { className: "cw-file", "data-state": state.kind },
            h(
                "span",
                { className: "cw-file-name" },
                file.name,
                h("span", { className: "cw-file-meta" }, ` ${readableSize(file.size)}`)
            ),
            h(
                "span",
                { className: "cw-file-state" },
                state.kind === "added" && h(Fragment, null, h(CheckIcon), "ADDED"),
                state.kind === "uploading" && `UPLOADING · ${state.percent}%`,
                state.kind === "failed" &&
                    (state.retry
                        ? h(
                              Fragment,
                              null,
                              "DIDN'T UPLOAD · ",
                              h(
                                  "button",
                                  { type: "button", className: "cw-file-action", disabled: locked, onClick: onRetry },
                                  "RETRY"
                              )
                          )
                        : "DIDN'T UPLOAD · ADD IT AGAIN"),
                state.kind === "unfinished" && "DIDN'T FINISH · ADD IT AGAIN"
            ),
            h(
                "button",
                {
                    type: "button",
                    className: "cw-file-action cw-file-remove",
                    disabled: locked,
                    "aria-label": `Remove ${file.name}`,
                    onClick: onRemove,
                },
                "REMOVE"
            )
        )
    }

    /* -------------------------------------------------------
       REVIEW BLOCK — the note box and approval
    ------------------------------------------------------- */

    function ReviewBlock({ label, placeholder, cta, after, approverName, hasLink, approved, onApprove }) {
        return h(
            "div",
            { className: "cw-review" },
            h(
                "label",
                { className: "cw-review-label" },
                h("span", null, label),
                h("textarea", { rows: 3, className: "cw-field cw-review-field", placeholder })
            ),

            approved
                ? h("div", { className: "cw-approved", role: "status" }, `APPROVED · ${approverName.toUpperCase()}`)
                : h(
                      "button",
                      { type: "button", className: "cw-cta cw-approve", disabled: !hasLink, onClick: onApprove },
                      h("span", null, cta),
                      h("span", { className: "cw-cta-arrow", "aria-hidden": "true" }, "→")
                  ),

            !hasLink &&
                !approved &&
                h(
                    "span",
                    { className: "cw-locked-note" },
                    `Only ${approverName}, the approver named in your brief, can approve. Open the link we emailed them.`
                ),

            h("p", { className: "cw-after" }, after)
        )
    }

    /* -------------------------------------------------------
       REVIEW — the cut, round by round
    ------------------------------------------------------- */

    function ReviewSection({ note, cut, approverName, hasLink, approved, onApprove }) {
        const [playing, setPlaying] = React.useState(false)
        const video = cut?.video
        const poster = cut?.poster?.src ? cut.poster : undefined
        const round = cut?.round ?? DEFAULT_CUT.round
        const rounds = cut?.rounds ?? DEFAULT_CUT.rounds

        return h(
            "section",
            { className: "cw-stage-section" },
            h(
                "div",
                { className: "cw-head" },
                h(Eyebrow, { num: "03", label: "THE CUT" }),
                h("h2", { className: "cw-h2" }, "First look."),
                h("p", { className: "cw-note" }, note, " ", h(Signature))
            ),

            h(
                "div",
                { className: "cw-player" },
                h(
                    "div",
                    { className: "cw-frame" },
                    playing && video
                        ? h("video", {
                              src: video,
                              poster: poster?.src,
                              controls: true,
                              autoPlay: true,
                              playsInline: true,
                              controlsList: "nodownload",
                          })
                        : h(
                              Fragment,
                              null,
                              poster && h("img", { src: poster.src, srcSet: poster.srcSet, alt: poster.alt ?? "" }),
                              h(
                                  "button",
                                  {
                                      type: "button",
                                      className: "cw-play",
                                      "aria-label": "Play the review cut",
                                      onClick: () => setPlaying(true),
                                  },
                                  h(PlayIcon)
                              ),
                              h("span", { className: "cw-frame-tag" }, "REVIEW CUT · STREAM ONLY")
                          )
                ),
                h("span", { className: "cw-round" }, `ROUND ${round} OF ${rounds}`)
            ),

            h(ReviewBlock, {
                label: "NOTES, WITH TIMES",
                placeholder: "At 0:14 — …",
                cta: "APPROVE THIS CUT",
                after: "One note list, one voice. I read every note before the next round.",
                approverName,
                hasLink,
                approved,
                onApprove,
            })
        )
    }

    /* -------------------------------------------------------
       DELIVER — the finished files
    ------------------------------------------------------- */

    function DeliverSection({ note, delivery }) {
        const files = [
            {
                name: delivery?.tvName || DEFAULT_DELIVERY.tvName,
                meta: delivery?.tvMeta || DEFAULT_DELIVERY.tvMeta,
                href: delivery?.tvFile,
            },
            {
                name: delivery?.captionedName || DEFAULT_DELIVERY.captionedName,
                meta: delivery?.captionedMeta || DEFAULT_DELIVERY.captionedMeta,
                href: delivery?.captionedFile,
            },
            {
                name: delivery?.webName || DEFAULT_DELIVERY.webName,
                meta: delivery?.webMeta || DEFAULT_DELIVERY.webMeta,
                href: delivery?.webFile,
            },
        ]

        return h(
            "section",
            { className: "cw-stage-section" },
            h(
                "div",
                { className: "cw-head" },
                h(Eyebrow, { num: "03", label: "YOUR SPOT" }),
                h("h2", { className: "cw-h2" }, "It's ready."),
                h("p", { className: "cw-note" }, note, " ", h(Signature)),
                h("span", { className: "cw-spec" }, delivery?.spec || DEFAULT_DELIVERY.spec)
            ),

            h(
                "div",
                { className: "cw-deliverables" },
                files.map((file) =>
                    h(
                        "div",
                        { className: "cw-deliverable", key: file.name },
                        h(
                            "span",
                            { className: "cw-deliverable-text" },
                            h("span", { className: "cw-deliverable-name" }, file.name),
                            h("span", { className: "cw-deliverable-meta" }, file.meta)
                        ),
                        /* Without a file the pill keeps its place but is not
                           a link: an href="#" would jump the page. */
                        h(
                            "a",
                            {
                                className: "cw-pill cw-download",
                                href: file.href || undefined,
                                download: file.href ? file.name : undefined,
                                "aria-disabled": file.href ? undefined : true,
                            },
                            "DOWNLOAD"
                        )
                    )
                )
            ),

            h("p", { className: "cw-closing" }, "This page stays live as the record of your project.")
        )
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(ClientWelcome, CONFIG))
})()
</script>
</body>
</html>
