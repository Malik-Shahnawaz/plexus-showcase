<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A client's address is their key to their brief: kept out of search. -->
<meta name="robots" content="noindex">
<title>Welcome — Plexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<!--
    CLIENT WELCOME — Plexus

    The Plexus copy of creative_directions/client_welcome.tsx, for GitHub
    Pages: ctvbuyer/ctv-buyer-client-welcome.html with Plexus's name, logo
    and address, and nothing else changed. The behaviour is that component's,
    line for line: the three stages, the brief written into Supabase as the
    client goes (load, save, upload, sign, confirm, remove, submit, create,
    through the client-brief edge function), the cache on the device, the
    review blocks and the deliverables. Only the look is Plexus's, which is
    the showcase's: its blue gradient sheet, Plus Jakarta Sans and JetBrains
    Mono, the teal accent, the logo header.

    A change to the component's behaviour, its items (NEEDS) or its copy
    belongs here too, and in the CTVBuyer page, and the other way round.
    Framer's property controls are the CONFIG block at the top of the script
    below.

    The address: a client's page is /welcome/{name}-{slug}, the name any
    number of hyphen-joined words (client, client-name,
    client-name-surname), the slug six letters and digits (getClientSlugFromPath, below), where the
    component's tail is eight. The words before the slug name the client,
    as there, and the brief is filed under the whole last part, lowercased
    (client-name-a8kx92), as the component files it. GitHub Pages has no file at
    /welcome/…, so it serves 404.html, which fetches this page and draws it
    in place, leaving the address in the bar as it was opened. Opened as
    itself, or at /welcome/, the page welcomes a guest.
-->
<style>
html,
body {
    margin: 0;
    background: #03192c;
}

#root {
    min-height: 100vh;
}

/* Every rule below starts with the root's class, as in the component. */
.cd-welcome {
    --cw-fg: #e9edf5;
    --cw-fg-hover: #6fa8ff;
    --cw-ink: #03192c;
    --cw-light: #dbe5f3;
    --cw-soft: #c3d2e8;
    --cw-muted: #a9bedc;
    --cw-dim: #8ea5c6;
    --cw-done: rgba(255, 255, 255, 0.42);
    --cw-dash: rgba(255, 255, 255, 0.34);
    --cw-line: rgba(255, 255, 255, 0.26);
    --cw-rule: rgba(255, 255, 255, 0.18);
    --cw-surface: rgba(3, 25, 44, 0.55);
    --cw-field: rgba(3, 25, 44, 0.42);
    --cw-sans: "Plus Jakarta Sans", Helvetica, sans-serif;
    --cw-mono: "JetBrains Mono", monospace;

    /* The layout is chosen by the page's own width through container
       queries, as the component's is: 810 flips the phone board to the
       desktop one, 1024 parts the brief into two columns. */
    container: cd-welcome / inline-size;
    width: 100%;
    overflow-x: clip;
    color: var(--cw-fg);
    font-family: var(--cw-sans);
    font-size: 16px;
    font-weight: 400;
    line-height: normal;
    text-align: left;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

.cd-welcome, .cd-welcome *, .cd-welcome *::before, .cd-welcome *::after {
    box-sizing: border-box;
}

.cd-welcome h1, .cd-welcome h2, .cd-welcome p, .cd-welcome figure {
    margin: 0;
    padding: 0;
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
}

.cd-welcome button {
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
}

.cd-welcome input, .cd-welcome textarea {
    margin: 0;
    font: inherit;
    letter-spacing: inherit;
}

.cd-welcome a {
    color: var(--cw-fg);
    text-decoration: none;
}

.cd-welcome a:hover {
    color: var(--cw-fg-hover);
}

.cd-welcome a:focus-visible,
.cd-welcome button:focus-visible,
.cd-welcome input:focus-visible,
.cd-welcome textarea:focus-visible {
    outline: 2px solid var(--cw-accent);
    outline-offset: 4px;
}

.cd-welcome svg {
    display: block;
    flex: none;
}

/* THE SHEET — Plexus's grid and glow over the blue gradient. A child of
   the root, not the root: a container query can't style the container
   itself, and the phone needs wider glows than the desktop board. */
.cd-welcome .cw-sheet {
    min-height: 100vh;
    background-color: #06306b;
    background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        radial-gradient(ellipse 130% 7% at 28% 8%, rgba(30, 220, 175, 0.34), transparent 70%),
        radial-gradient(ellipse 140% 8% at 78% 44%, rgba(0, 210, 195, 0.28), transparent 70%),
        radial-gradient(ellipse 120% 9% at 20% 85%, rgba(40, 160, 255, 0.26), transparent 70%),
        linear-gradient(168deg, #03192c 0%, #063a7a 32%, #0a5cb0 62%, #0b86b8 100%);
    background-size: 76px 76px, 76px 76px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
}

.cd-welcome .cw-page {
    display: flex;
    flex-direction: column;
    padding: 16px 24px 40px;
}

/* HEADER — the logo, and the way into the showcase. */
.cd-welcome .cw-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    min-height: 44px;
    font-family: var(--cw-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--cw-muted);
}

/* The wordmark is wider than CTVBuyer's (1480 × 267): at 28px tall it
   and CREATIVE SHOWCASE fill a 390 phone, so on a narrower one the logo
   gives up width, scaled whole, rather than push the link off the edge. */
.cd-welcome .cw-logo {
    display: flex;
    align-items: center;
    min-width: 0;
}

.cd-welcome .cw-logo img {
    display: block;
    width: auto;
    max-width: 100%;
    height: 28px;
    object-fit: contain;
    object-position: left center;
}

.cd-welcome .cw-showcase {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    color: var(--cw-muted);
    white-space: nowrap;
    transition: color 200ms ease;
}

.cd-welcome .cw-showcase:hover {
    color: var(--cw-fg);
}

.cd-welcome .cw-showcase-arrow {
    letter-spacing: 0;
    color: var(--cw-accent);
}

/* EYEBROW — the numbered section label */
.cd-welcome .cw-eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--cw-mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--cw-muted);
}

.cd-welcome .cw-eyebrow-num {
    color: var(--cw-accent);
}

/* 01 WELCOME */
.cd-welcome .cw-welcome {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-top: 56px;
}

/* 52px on the phone, and scaled below it so a long client name still
   breaks by word on a small phone. */
.cd-welcome .cw-h1 {
    font-size: min(52px, 100cqw * 52 / 390);
    font-weight: 500;
    line-height: 0.96;
    letter-spacing: -0.04em;
    overflow-wrap: break-word;
}

.cd-welcome .cw-sig {
    font-family: var(--cw-mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--cw-muted);
    white-space: nowrap;
}

/* SECTION HEADS */
.cd-welcome .cw-head {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.cd-welcome .cw-h2 {
    font-size: 36px;
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -0.03em;
}

.cd-welcome .cw-head-note {
    font-size: 17px;
    line-height: 1.55;
    color: var(--cw-soft);
}

/* The desktop board breaks the note before its last sentence. */
.cd-welcome .cw-br {
    display: none;
}

/* 02 YOUR PROJECT */
.cd-welcome .cw-stages {
    display: flex;
    flex-direction: column;
    gap: 32px;
    margin-top: 96px;
}

.cd-welcome .cw-stage-grid {
    display: flex;
    flex-direction: column;
    gap: 32px;
}

.cd-welcome .cw-stage {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
}

.cd-welcome .cw-rail {
    height: 3px;
    border-radius: 2px;
    background: var(--cw-rule);
}

.cd-welcome .cw-stage[data-state="done"] .cw-rail {
    background: var(--cw-done);
}

.cd-welcome .cw-stage[data-state="current"] .cw-rail {
    background: var(--cw-accent);
}

.cd-welcome .cw-stage-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--cw-mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--cw-muted);
}

.cd-welcome .cw-stage-here {
    color: var(--cw-accent);
}

.cd-welcome .cw-stage-title {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--cw-fg);
}

.cd-welcome .cw-stage[data-state="next"] .cw-stage-title {
    color: var(--cw-muted);
}

.cd-welcome .cw-stage-body {
    font-size: 16px;
    line-height: 1.55;
    color: var(--cw-soft);
}

/* 03 YOUR BRIEF
   scroll-margin-top: the air left above the eyebrow when a send brings
   the section back into view. */
.cd-welcome .cw-brief {
    display: flex;
    flex-direction: column;
    gap: 32px;
    margin-top: 96px;
    scroll-margin-top: 40px;
}

.cd-welcome .cw-brief-list {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.cd-welcome .cw-progress {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
}

.cd-welcome .cw-progress-label {
    font-family: var(--cw-mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--cw-soft);
}

.cd-welcome .cw-bar {
    height: 3px;
    border-radius: 2px;
    background: var(--cw-rule);
    overflow: hidden;
}

.cd-welcome .cw-bar-fill {
    height: 100%;
    background: var(--cw-accent);
    transition: width 300ms ease;
}

.cd-welcome .cw-saved {
    font-size: 15px;
    line-height: 1.5;
    color: var(--cw-muted);
}

/* The server couldn't be reached, or a save failed: in the accent, as
   the send's own error is. */
.cd-welcome .cw-saved[data-tone="loud"],
.cd-welcome .cw-notice {
    font-size: 15px;
    line-height: 1.5;
    color: var(--cw-accent);
}

.cd-welcome .cw-needs {
    display: flex;
    flex-direction: column;
}

.cd-welcome .cw-need {
    border-top: 1px solid var(--cw-rule);
}

.cd-welcome .cw-need-toggle {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 12px;
    align-items: start;
    width: 100%;
    padding: 20px 0;
    color: var(--cw-fg);
}

.cd-welcome .cw-need-num {
    padding-top: 3px;
    font-family: var(--cw-mono);
    font-size: 13px;
    color: var(--cw-muted);
}

.cd-welcome .cw-need-text {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
}

.cd-welcome .cw-need-title {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.3;
}

.cd-welcome .cw-need-body {
    font-size: 15px;
    line-height: 1.45;
    color: var(--cw-muted);
}

.cd-welcome .cw-added {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--cw-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--cw-accent);
}

.cd-welcome .cw-added svg {
    width: 12px;
    height: 12px;
}

.cd-welcome .cw-added-side {
    display: none;
}

.cd-welcome .cw-need-end {
    display: flex;
    align-items: center;
    gap: 16px;
}

.cd-welcome .cw-chevron {
    width: 14px;
    height: 14px;
    margin-top: 5px;
    color: var(--cw-muted);
    transition: transform 200ms ease;
}

.cd-welcome .cw-need[data-open="true"] .cw-chevron {
    transform: rotate(180deg);
}

.cd-welcome .cw-need-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 0 0 28px;
}

.cd-welcome .cw-drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 192px;
    padding: 20px;
    border: 1px dashed var(--cw-dash);
    border-radius: 8px;
    background: var(--cw-field);
    text-align: center;
    transition: border-color 200ms ease;
}

.cd-welcome .cw-drop[data-over="true"] {
    border-color: var(--cw-accent);
}

.cd-welcome .cw-drop-icon {
    width: 26px;
    height: 26px;
    color: var(--cw-soft);
}

.cd-welcome .cw-drop-text {
    display: none;
    font-size: 17px;
    color: var(--cw-light);
}

.cd-welcome .cw-file-input {
    display: none;
}

/* The outlined pill: CHOOSE FILES, DOWNLOAD, START A NEW BRIEF. */
.cd-welcome .cw-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    padding: 0 24px;
    border: 1px solid var(--cw-fg);
    border-radius: 999px;
    background: transparent;
    color: var(--cw-fg);
    font-family: var(--cw-mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    white-space: nowrap;
    transition: background-color 200ms ease, color 200ms ease;
}

.cd-welcome .cw-pill:hover {
    background: var(--cw-fg);
    color: var(--cw-ink);
}

.cd-welcome .cw-pill[aria-disabled="true"] {
    color: var(--cw-fg);
    background: transparent;
    cursor: default;
}

.cd-welcome .cw-formats {
    font-family: var(--cw-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--cw-muted);
}

/* In the accent, as the send's own error is. */
.cd-welcome .cw-refused {
    font-size: 15px;
    line-height: 1.45;
    color: var(--cw-accent);
}

/* THE FILES on an upload item, one row each: name and size, how it
   stands, REMOVE. On the phone the state sits under the name and REMOVE
   spans both rows; on the desktop all three sit on one line. */
.cd-welcome .cw-files {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
}

.cd-welcome .cw-file {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    column-gap: 14px;
    row-gap: 4px;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--cw-line);
    border-radius: 6px;
    background: var(--cw-field);
}

.cd-welcome .cw-file-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 15px;
    line-height: 1.4;
    color: var(--cw-fg);
}

.cd-welcome .cw-file-meta {
    font-family: var(--cw-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--cw-muted);
}

.cd-welcome .cw-file-state {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-family: var(--cw-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--cw-soft);
}

.cd-welcome .cw-file-state svg {
    width: 12px;
    height: 12px;
    flex: none;
}

.cd-welcome .cw-file[data-state="added"] .cw-file-state,
.cd-welcome .cw-file[data-state="failed"] .cw-file-state,
.cd-welcome .cw-file[data-state="unfinished"] .cw-file-state {
    color: var(--cw-accent);
}

/* RETRY and REMOVE: mono, underlined, no chrome. */
.cd-welcome .cw-file-action {
    font-family: var(--cw-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--cw-fg);
    text-decoration: underline;
    text-underline-offset: 3px;
    white-space: nowrap;
}

.cd-welcome .cw-file-action:disabled {
    color: var(--cw-dim);
    text-decoration: none;
    cursor: default;
}

.cd-welcome .cw-file-remove {
    grid-column: 2;
    grid-row: 1 / span 2;
}

.cd-welcome .cw-field {
    width: 100%;
    min-height: 52px;
    padding: 14px 16px;
    border: 1px solid var(--cw-line);
    border-radius: 6px;
    background: var(--cw-field);
    color: var(--cw-fg);
    font-family: var(--cw-sans);
    font-size: 17px;
    line-height: 1.5;
    letter-spacing: normal;
    cursor: text;
}

.cd-welcome .cw-field::placeholder {
    color: var(--cw-dim);
    opacity: 1;
}

.cd-welcome textarea.cw-field {
    min-height: 120px;
    resize: vertical;
}

.cd-welcome .cw-next {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 22px;
    border-radius: 999px;
    background: var(--cw-rule);
    color: var(--cw-fg);
    font-family: var(--cw-mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    white-space: nowrap;
    transition: background-color 200ms ease;
}

.cd-welcome .cw-next:hover {
    background: var(--cw-line);
}

.cd-welcome .cw-send {
    padding-top: 28px;
    border-top: 1px solid var(--cw-rule);
}

.cd-welcome .cw-send-hint {
    margin-bottom: 20px;
    font-size: 15px;
    line-height: 1.55;
    color: var(--cw-muted);
}

/* The accent pill: SEND IT, APPROVE. */
.cd-welcome .cw-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    min-height: 60px;
    padding: 0 24px;
    border-radius: 999px;
    background: var(--cw-accent);
    color: var(--cw-ink);
    font-family: var(--cw-mono);
    font-size: 14px;
    letter-spacing: 0.12em;
    text-align: center;
    transition: filter 200ms ease;
}

.cd-welcome .cw-cta:hover {
    color: var(--cw-ink);
    filter: brightness(1.06);
}

.cd-welcome .cw-cta:disabled {
    background: var(--cw-rule);
    color: var(--cw-dim);
    cursor: not-allowed;
    filter: none;
}

.cd-welcome .cw-cta[aria-busy="true"] {
    cursor: progress;
    filter: none;
}

.cd-welcome .cw-cta-arrow {
    letter-spacing: 0;
}

.cd-welcome .cw-send-error {
    margin-top: 16px;
    font-size: 15px;
    line-height: 1.55;
    color: var(--cw-accent);
}

.cd-welcome .cw-send-after {
    margin-top: 16px;
    font-size: 15px;
    line-height: 1.55;
    color: var(--cw-soft);
}

/* After a send: SENT, when, and the pill that starts the next brief. */
.cd-welcome .cw-new-brief {
    margin-top: 20px;
}

/* THE RECORD — the stages already passed */
.cd-welcome .cw-record {
    display: flex;
    flex-direction: column;
    margin-top: 96px;
}

.cd-welcome .cw-record-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 0;
    border-top: 1px solid var(--cw-rule);
    font-family: var(--cw-mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--cw-soft);
}

.cd-welcome .cw-record-check {
    display: flex;
    color: var(--cw-accent);
}

.cd-welcome .cw-record-check svg {
    width: 14px;
    height: 14px;
}

/* 03 REVIEW · DELIVER */
.cd-welcome .cw-stage-section {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-top: 48px;
}

.cd-welcome .cw-stage-section .cw-head {
    gap: 20px;
}

.cd-welcome .cw-stage-section .cw-h2 {
    letter-spacing: -0.035em;
}

.cd-welcome .cw-note {
    max-width: 820px;
    font-size: 19px;
    line-height: 1.5;
    color: var(--cw-fg);
}

.cd-welcome .cw-review {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 32px;
    border-top: 1px solid var(--cw-rule);
}

.cd-welcome .cw-review-label {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.cd-welcome .cw-review-label > span {
    font-family: var(--cw-mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--cw-soft);
}

.cd-welcome textarea.cw-review-field {
    min-height: 104px;
}

.cd-welcome .cw-approve {

    /* -------------------------------------------------------

    const pad = (n) => String(n + 1).padStart(2, "0")

    /* "PDF · JPG · SVG · PNG" → ["pdf", "jpg", "jpeg", "svg", "png"]: the
       extensions an item takes, as UPLOAD_ITEMS in the edge function lists
       them. A JPG may also be named .jpeg. */
    const extensionsFor = (formats) =>
        formats
            .split("·")
            .map((f) => f.trim().toLowerCase())
            .filter(Boolean)
            .flatMap((f) => (f === "jpg" ? ["jpg", "jpeg"] : [f]))

        extensionsFor(formats)
            .map((f) => `.${f}`)
            .join(",")

    /* The picker's filter can be switched off and a drop ignores it, so each
       file is checked again here: a video dropped on the photos is turned
       away at once, not at SEND IT, where the function would refuse the
       whole brief over it. */
    const takes = (formats, name) =>
        name.includes(".") &&
        extensionsFor(formats).includes(name.split(".").pop().toLowerCase())

    const refusedSummary = (names, formats) =>
        `Not added: ${names.join(", ")}. We take ${formats} here.`

    /* -------------------------------------------------------
       THE CLIENT
       Named by the page's address, so one page serves every
       client: the words before the slug are the name, unless
       CONFIG.clientName says otherwise. The whole last part,
       lowercased (CLIENT_KEY), keys the brief on the server
       and its cache on this device, as the component's slug
       does, so the function finds the same draft from either
       page and two clients on one device keep two briefs.
       With no slug the page welcomes a guest.
    ------------------------------------------------------- */

    const GUEST = "Dear Guest"

    /* Read once, before the first render: there is no server render here
       to match, so the page never shows a guest greeting first. */
    const CLIENT_SLUG = getClientSlugFromPath()

    /* The address's last part, "client-name-a8Kx92", on a client's page. */
    const CLIENT_PAGE = CLIENT_SLUG ? window.location.pathname.split("/").pop() : ""

    /* "client-name-a8kx92": what the function files the brief under. The
       function lowercases a slug, so the cache key is lowercased too, and
       /welcome/Client-Name-A8KX92 is the same client's page. */
    const CLIENT_KEY = CLIENT_PAGE.toLowerCase()

    /* "client-name-a8Kx92" → "Client Name", "client-name-surname-a8Kx92" →
       "Client Name Surname": the words before "-{slug}". */
    const CLIENT_NAME = CLIENT_SLUG
        ? CLIENT_PAGE.slice(0, -(CLIENT_SLUG.length + 1))
              .toLowerCase()
              .split("-")
              .filter(Boolean)
              .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
              .join(" ")
        : ""

    /* -------------------------------------------------------
       THE BRIEF ON THE SERVER
       The brief lives in Supabase from the first keystroke, in
       the one client_briefs row the client-brief edge function
       keeps per client, so a client can start on one device
       and carry on from another. "load" fetches the client's
       draft, making one on a first visit; "save" writes the
       typed answers as they change; "upload" adds a file and
       signs it an upload token, and "confirm" and "remove"
       finish and drop one. Between upload and confirm the file
       goes from the browser straight to Supabase Storage.
       "submit" sends the brief, and "create" starts the next
       one after a send.

       The server copy is the brief. Every save carries the
       version the page loaded, and a save over a newer version
       is refused with the newer brief, which the page then
       shows. Files are added and removed one at a time, each
       call answering with the whole list, so the page always
       shows the server's.
    ------------------------------------------------------- */

    /* Mirrors MAX_ANSWER_CHARS in the function. The fields stop there, so
       nothing is cut off on the way in. */
    const MAX_ANSWER_CHARS = 5000

    /* Mirrors EMAIL in the function, which refuses a send whose address
       fails it. Loose on purpose: it catches a slip — no @, no dot after
       it, a space — and only writing to an address proves it. */
    const MAX_EMAIL_CHARS = 254
    const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/

    const looksLikeEmail = (value) => value.length <= MAX_EMAIL_CHARS && EMAIL.test(value)

    /* How long one call to the function may take. */
    const CALL_TIMEOUT_MS = 45 * 1000

    /* How long after the last keystroke the answers go to the server. */
    const SAVE_DELAY_MS = 1000

    /* The waits before a failed save or load is tried again, the last one
       repeating. */
    const RETRY_MS = [3000, 8000, 15000, 30000, 60000]

    const SEND_FAILED = "That didn't go through. Try again, or email us."
    const OFFLINE = "We couldn't reach the server. Check your connection and try again."
    const UNREACHABLE = "We couldn't reach the server. Check your connection; we'll keep trying."
    const SAVE_FAILED = "Couldn't save. Trying again."
    const NOT_SAVED = "We couldn't save your answers. Check your connection and try again."
    const CHANGED_ELSEWHERE = "This brief was updated on another device. Showing the latest."
    const CHANGED_BEFORE_SEND = "This brief was updated on another device. Check it, then send again."
    const UNFINISHED = "Some files didn't finish uploading. Add them again, or remove them."
    const BAD_EMAIL = "That email address doesn't look right. Check it, or leave it blank."

    /* An error whose message is written for the page. Anything else that
       reaches a catch is a bug, logged and shown as SEND_FAILED. */
    class SendError extends Error {}

    /* The function's answer to a refused call, with its status and whatever
       else it said: the newer brief on a 409, the files that didn't land on
       a refused submit. Status 0 is no answer at all: offline, or out of
       time. */
    class BriefError extends SendError {
        constructor(status, message, answer = {}) {
            super(message)
            this.status = status
            this.answer = answer
        }
    }

    /* A file that didn't reach Storage after putFile's retries. */
    class UploadError extends SendError {}

    /* An upload stopped by the page itself: the file removed while it was
       going, or chosen again. */
    class CancelledError extends Error {}

    /* keepalive lets the last save of a tab being closed go out after the
       page is gone. */
    async function callBrief(endpoint, anonKey, body, keepalive = false) {
        const headers = { "Content-Type": "application/json" }
        if (anonKey) {
            headers.apikey = anonKey
            headers.Authorization = `Bearer ${anonKey}`
        }
        const controller = new AbortController()
        const timer = setTimeout(() => controller.abort(), CALL_TIMEOUT_MS)
        let res
        try {
            res = await fetch(endpoint, {
                method: "POST",
                headers,
                body: JSON.stringify(body),
                signal: controller.signal,
                keepalive,
            })
        } catch {
            throw new BriefError(0, OFFLINE)
        } finally {
            clearTimeout(timer)
        }
        const data = await res.json().catch(() => null)
        const answer = data && typeof data === "object" ? data : {}
        if (!res.ok) {
            /* The function's own refusals (a bad file, a newer brief) are
               worded for the page. A 5xx may be the gateway in front of it,
               whose text isn't. */
            const message =
                typeof answer.error === "string" && res.status < 500 ? answer.error : SEND_FAILED
            throw new BriefError(res.status, message, answer)
        }
        return answer
    }

    const TYPED_IDS = NEEDS.filter((need) => need.kind !== "upload").map((need) => need.id)
    const UPLOAD_IDS = NEEDS.filter((need) => need.kind === "upload").map((need) => need.id)

    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i

    const isRecord = (value) =>
        typeof value === "object" && value !== null && !Array.isArray(value)

    /* A files list from the function, checked before anything is shown on
       its say-so: { id, item, name, size, status } each, status "uploading"
       from the moment the file is added until confirm has checked it is in
       Storage. Null when it isn't one. */
    function parseFiles(value) {
        if (!Array.isArray(value)) return null
        const files = []
        for (const entry of value) {
            if (!isRecord(entry)) return null
            const { id, item, name, size, status } = entry
            if (
                typeof id !== "string" ||
                typeof item !== "string" ||
                typeof name !== "string" ||
                typeof size !== "number" ||
                (status !== "uploading" && status !== "uploaded")
            ) {
                return null
            }
            files.push({ id, item, name, size, status })
        }
        return files
    }

    /* The brief as the server holds it: { id, status ("draft" or
       "submitted"), version, submittedAt, open, answers, files }. */
    function parseBrief(value) {
        if (!isRecord(value)) return null
        const files = parseFiles(value.files)
        if (
            typeof value.id !== "string" ||
            !UUID_RE.test(value.id) ||
            (value.status !== "draft" && value.status !== "submitted") ||
            typeof value.version !== "number" ||
            !files
        ) {
            return null
        }
        const answers = {}
        if (isRecord(value.answers)) {
            for (const id of TYPED_IDS) {
                const answer = value.answers[id]
                if (typeof answer === "string" && answer) {
                    answers[id] = answer.slice(0, MAX_ANSWER_CHARS)
                }
            }
        }
        const open =
            typeof value.open === "string" && NEEDS.some((need) => need.id === value.open)
                ? value.open
                : null
        return {
            id: value.id,
            status: value.status,
            version: value.version,
            submittedAt: typeof value.submittedAt === "string" ? value.submittedAt : null,
            open,
            answers,
            files,
        }
    }

    /* upload's answer: the new file, the whole list with it, and where to
       put it — Storage's signed upload endpoint, the bucket, the file's own
       path there, the type to send it as, and the token that lets one PUT
       write it. */
    function parseUpload(answer) {
        const file = parseFiles([answer.file])?.[0]
        const files = parseFiles(answer.files)
        const { endpoint, bucket, path, contentType, token } = answer
        if (
            !file ||
            !files ||
            typeof endpoint !== "string" ||
            typeof bucket !== "string" ||
            typeof path !== "string" ||
            typeof contentType !== "string" ||
            typeof token !== "string"
        ) {
            throw new Error("Unexpected answer to upload")
        }
        return { file, files, upload: { endpoint, bucket, path, contentType, token } }
    }

    /* The waits before each retry of a failed file: about two minutes in
       all, so Wi-Fi that drops out for a while doesn't lose the file. A
       retry sends the whole file again. */
    const RETRY_DELAYS = [0, 1000, 3000, 5000, 10000, 20000, 30000, 60000]

    /* A request that has sent nothing and heard nothing for this long is
       given up on and retried, rather than left frozen at one percentage. */
    const STALL_MS = 2 * 60 * 1000

    /* A dropped or stalled connection (status 0), too many requests, or the
       server's own trouble. */
    const retryable = (status) => status === 0 || status === 429 || status >= 500

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

    /* Storage answers most refusals with a 400 and puts the real status in
       the body. */
    function storageStatus(xhr) {
        try {
            return Number(JSON.parse(xhr.responseText).statusCode) || xhr.status
        } catch {
            return xhr.status
        }
    }

    /* The page's hold on an upload in progress: abort stops the request
       that is going and marks the upload cancelled, so putFile doesn't
       retry it. */
    function newHandle() {
        const handle = {
            cancelled: false,
            abort: () => {
                handle.cancelled = true
            },
        }
        return handle
    }

    /* XHR rather than fetch for its upload progress. Resolves with every
       answer; a failed, stalled or aborted connection shows as status 0. */
    function sendFile(url, file, contentType, onProgress, handle) {
        return new Promise((resolve) => {
            const xhr = new XMLHttpRequest()
            let timer
            const watch = () => {
                clearTimeout(timer)
                timer = setTimeout(() => xhr.abort(), STALL_MS)
            }
            const done = () => {
                clearTimeout(timer)
                handle.abort = () => {
                    handle.cancelled = true
                }
                resolve(xhr)
            }
            handle.abort = () => {
                handle.cancelled = true
                xhr.abort()
            }
            xhr.open("PUT", url)
            xhr.setRequestHeader("Content-Type", contentType)
            xhr.upload.onprogress = (e) => {
                watch()
                onProgress(e.loaded)
            }
            xhr.onload = done
            xhr.onerror = done
            xhr.onabort = done
            watch()
            xhr.send(file)
        })
    }

    /* Each file goes to Storage whole, in one request to its signed upload
       URL. The type comes from the function, by extension, rather than the
       browser. The token lasts two hours and is checked as the request
       starts, so a file queued behind large ones on a slow connection can
       find its token run out: a refused one is renewed, once. */
    async function putFile(upload, file, onProgress, renewToken, handle) {
        const target = `${upload.endpoint}/${upload.bucket}/${upload.path
            .split("/")
            .map(encodeURIComponent)
            .join("/")}`
        let token = upload.token
        let renewed = false
        let tries = 0

        while (true) {
            if (handle.cancelled) throw new CancelledError()
            const res = await sendFile(
                `${target}?token=${encodeURIComponent(token)}`,
                file,
                upload.contentType,
                onProgress,
                handle
            )
            if (handle.cancelled) throw new CancelledError()
            if (res.status >= 200 && res.status < 300) return
            const status = storageStatus(res)
            /* Already at its path: an earlier try landed but its answer was
               lost. Every file has its own path, so nothing else can be
               there, and confirm checks the size. */
            if (status === 409) return
            if ([400, 401, 403].includes(status) && !renewed) {
                token = await renewToken()
                renewed = true
                continue
            }
            if (!retryable(res.status) || tries >= RETRY_DELAYS.length) {
                throw new UploadError(`${file.name} didn't upload.`)
            }
            await wait(RETRY_DELAYS[tries++])
        }
    }

    const readableSize = (bytes) =>
        bytes >= 1024 ** 3
            ? `${(bytes / 1024 ** 3).toFixed(1)} GB`
            : bytes >= 1024 ** 2
              ? `${(bytes / 1024 ** 2).toFixed(1)} MB`
              : `${Math.max(1, Math.round(bytes / 1024))} KB`

    /* "September 28, 2026", in the visitor's language. */
    const sentOn = (iso) => {
        const date = iso ? new Date(iso) : null
        return date && !Number.isNaN(date.getTime())
            ? date.toLocaleDateString(undefined, {
                  year: "numeric",
                  month: "long",
                  day: "numeric",
              })
            : ""
    }

    /* A new id for a file kept only on this device. */
    function newId() {
        const c = typeof crypto !== "undefined" ? crypto : undefined
        if (c?.randomUUID) return c.randomUUID()
        const bytes = new Uint8Array(16)
        if (c?.getRandomValues) c.getRandomValues(bytes)
        else for (let i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256)
        bytes[6] = (bytes[6] & 0x0f) | 0x40
        bytes[8] = (bytes[8] & 0x3f) | 0x80
        const hex = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("")
        return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`
    }

    /* -------------------------------------------------------
       THE CACHE ON THIS DEVICE
       The typed answers, which item is open and the files on
       the brief are kept in localStorage as they change, one
       entry per client. With a server, this is only a cache:
       it is what the page shows, read-only, when the server
       can't be reached — the server's copy replaces it as
       soon as it arrives, whatever the cache said. Without a
       server (no Endpoint, or a guest) it is the draft.

       The files themselves are never kept. A file restored
       from the cache is listed as one to add again, until the
       server says it is in. Every read and write is guarded,
       and a page that can't use storage works from memory.
       The entry is removed once the brief is sent.
    ------------------------------------------------------- */

    /* Bumped when the shape of a saved entry changes; parseStoredBrief is
       where an older one would be brought up to date. */
    const STORE_VERSION = 2

    /* One entry per client, so a page that welcomes two clients on one
       machine keeps their briefs apart. */
    const storeKeyFor = (slug) => `${SCOPE}:brief:${slug || "guest"}`

    /* How long after a change the cache is written. */
    const CACHE_DELAY_MS = 500

    /* The brief as the page first shows it. */
    const EMPTY_DRAFT = { open: NEEDS[0].id, answers: {}, files: [] }

    /* localStorage, or null where there is none or touching it throws. */
    function storage() {
        try {
            return window.localStorage ?? null
        } catch {
            return null
        }
    }

    /* A saved entry, checked field by field: anything hand-edited into a
       shape the page can't use is dropped. Files come back as ones to add
       again: the File objects are gone with the page that had them. */
    function parseStoredBrief(raw) {
        let data
        try {
            data = JSON.parse(raw)
        } catch {
            return null
        }
        if (!isRecord(data) || data.version !== STORE_VERSION || !isRecord(data.draft)) {
            return null
        }
        const { draft } = data
        const answers = {}
        if (isRecord(draft.answers)) {
            for (const id of TYPED_IDS) {
                const value = draft.answers[id]
                if (typeof value === "string" && value) {
                    answers[id] = value.slice(0, MAX_ANSWER_CHARS)
                }
            }
        }
        const files = (parseFiles(draft.files) ?? [])
            .filter((file) => UPLOAD_IDS.includes(file.item) && file.name)
            .slice(0, 50)
            .map((file) => ({ ...file, name: file.name.slice(0, 200), status: "uploading" }))
        const open =
            draft.open === null ||
            (typeof draft.open === "string" && NEEDS.some((n) => n.id === draft.open))
                ? draft.open
                : NEEDS[0].id
        return {
            version: STORE_VERSION,
            updatedAt: typeof data.updatedAt === "string" ? data.updatedAt : "",
            draft: { open, answers, files },
        }
    }

    /* The saved entry, or null when there is none or it can't be used. An
       unusable entry is removed, so it isn't parsed again on every visit. */
    function readStoredBrief(storeKey) {
        const store = storage()
        if (!store) return null
        let raw
        try {
            raw = store.getItem(storeKey)
        } catch {
            return null
        }
        if (raw === null) return null
        const stored = parseStoredBrief(raw)
        if (!stored) {
            try {
                store.removeItem(storeKey)
            } catch {
                /* Then it stays; the next visit drops it the same way. */
            }
        }
        return stored
    }

    /* Said once a page load, so a full quota or a blocked store shows in the
       console without filling it. */
    let warnedStore = false

    /* True when the entry is on disk. */
    function writeStoredBrief(storeKey, stored) {
        const store = storage()
        if (!store) return false
        try {
            store.setItem(storeKey, JSON.stringify(stored))
            return true
        } catch (err) {
            if (!warnedStore) {
                warnedStore = true
                console.warn("The brief couldn't be saved on this device:", err)
            }
            return false
        }
    }

    function clearStoredBrief(storeKey) {
        try {
            storage()?.removeItem(storeKey)
        } catch {
            /* Nothing to do: the entry will be replaced by the next draft. */
        }
    }

            "--cw-max": `${maxWidth}px`,
            /* The gutter eases down with the width like everything else on
               the desktop board, and never below the phone's 24. */
            "--cw-gutter": `clamp(24px, 100cqw * ${padding} / 1200, ${padding}px)`,
        }

        const record = [
            `BRIEF RECEIVED · ${NEEDS.length} OF ${NEEDS.length}`,
            `CUT APPROVED · ROUND ${cut?.round ?? DEFAULT_CUT.round} OF ${cut?.rounds ?? DEFAULT_CUT.rounds} · ${approver?.cutDate || DEFAULT_APPROVER.cutDate}`,
        ].slice(0, current)

        return h(
            "div",
            { className: SCOPE, style: rootStyle },
            h(
                "div",
                { className: "cw-sheet" },
                h(
                    "div",
                    { className: "cw-page" },
                    h(
                        "header",
                        { className: "cw-header" },
                        h(
                            "a",
                            { className: "cw-logo", href: showcase },
                            h("img", { src: siteUrl("assets/plexus-logo.png"), alt: "Plexus", width: 1480, height: 267 })
                        ),
                        h(
                            "a",
                            { className: "cw-showcase", href: showcase },
                            h("span", null, "CREATIVE SHOWCASE"),
                            h("span", { className: "cw-showcase-arrow", "aria-hidden": "true" }, "→")
                        )
                    ),

                    h(
                        "section",
                        { className: "cw-welcome" },
                        h(Eyebrow, { num: "01", label: "WELCOME" }),
                        h("h1", { className: "cw-h1" }, `Welcome, ${name}.`)
                    ),

                    h(
                        "section",
                        { className: "cw-stages" },
                        h(
                            "div",
                            { className: "cw-head" },
                            h(Eyebrow, { num: "02", label: "YOUR PROJECT" }),
                            h("h2", { className: "cw-h2" }, "Three stages. You approve each one.")
                        ),
                        h(
                            "div",
                            { className: "cw-stage-grid" },
                            STAGES.map((s, i) =>
                                h(StageCard, {
                                    key: s.title,
                                    num: pad(i),
                                    title: s.title,
                                    body: s.body,
                                    state: i < current ? "done" : i === current ? "current" : "next",
                                })
                            )
                        )
                    ),

                    current === 0
                        ? h(BriefSection, {
                              client: name,
                              slug,
                              storeKey: storeKeyFor(slug),
                              savesProgress,
                              send,
                              endpoint: submission?.endpoint?.trim() ?? "",
                              anonKey: submission?.anonKey?.trim() ?? "",
                          })
                        : h(
                              "section",
                              { className: "cw-record", "aria-label": "Earlier stages" },
                              record.map((text) =>
                                  h(

                                      h("span", { className: "cw-record-check" }, h(CheckIcon)),
                                      h("span", null, text)
                                  )
                              )
                          ),

                    current === 1 &&
                        h(ReviewSection, {
                            note: notes?.review || DEFAULT_NOTES.review,
                            cut,
                            approverName,
                            hasLink: approverHasLink,
                            approved,
                            onApprove: () => setApproved(true),
                        }),

                    current === 2 &&
                        h(DeliverSection, {
                            note: notes?.deliver || DEFAULT_NOTES.deliver,
                            delivery,
                        }),

                    h(
                        "section",
                        { className: "cw-from" },
                        h(Eyebrow, { num: "04", label: "FROM HERE" }),
                        h("h2", { className: "cw-h2-big" }, "The craft is the point."),
                        h(
                            "p",
                            { className: "cw-contact" },
                            "Questions at any stage: ",
                            h("a", { href: `mailto:${contact}` }, contact)
                        )
                    ),

                    showFooter &&
                        h(
                            "footer",
                            { className: "cw-footer" },
                            h("span", null, "PLEXUS · ©2026"),
                            h("span", null, `${SITE_LABEL}/WELCOME`, CLIENT_PAGE && `/${CLIENT_PAGE.toUpperCase()}`)
